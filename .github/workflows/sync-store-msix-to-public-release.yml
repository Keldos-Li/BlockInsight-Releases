name: Sync Store MSIX to public release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Draft release tag to finalize, for example v1.1.5.'
        required: true
        type: string

concurrency:
  group: sync-store-msix-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag }}
  MICROSOFT_STORE_ID: 9P467L4RBQXH
  WINDOWS_PACKAGE_IDENTITY_NAME: Keldos.BlockInsight
  WINDOWS_PACKAGE_PUBLISHER: CN=F3CEF3DF-A14E-4DDD-875E-DE0378559A97

jobs:
  sync:
    name: Sync Store-signed MSIX
    runs-on: ubuntu-latest
    timeout-minutes: 370
    steps:
      - name: Checkout release automation
        uses: actions/checkout@v4

      - name: Wait before first sync attempt (2h)
        run: sleep 7200

      - name: Check whether sync is still needed (2h)
        id: check-2h
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/sync-store-msix.cjs check

      - name: Upload Store MSIX to release (2h)
        if: steps.check-2h.outputs.should_sync == 'true'
        continue-on-error: true
        uses: JasonWei512/Upload-Microsoft-Store-MSIX-Package-to-GitHub-Release@v1
        with:
          store-id: ${{ env.MICROSOFT_STORE_ID }}
          token: ${{ github.token }}
          asset-name-pattern: BlockInsight_{version}_{arch}

      - name: Finalize release if Store MSIX is available (2h)
        if: steps.check-2h.outputs.should_sync == 'true'
        id: finalize-2h
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_ATTEMPT: 'false'
          IDENTITY_NAME: ${{ env.WINDOWS_PACKAGE_IDENTITY_NAME }}
          PUBLISHER: ${{ env.WINDOWS_PACKAGE_PUBLISHER }}
        run: node .github/scripts/sync-store-msix.cjs finalize

      - name: Wait before retry (3h)
        if: steps.check-2h.outputs.synced == 'false' && steps.finalize-2h.outputs.synced != 'true'
        run: sleep 3600

      - name: Check whether sync is still needed (3h)
        id: check-3h
        if: steps.check-2h.outputs.synced == 'false' && steps.finalize-2h.outputs.synced != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/sync-store-msix.cjs check

      - name: Upload Store MSIX to release (3h)
        if: steps.check-3h.outputs.should_sync == 'true'
        continue-on-error: true
        uses: JasonWei512/Upload-Microsoft-Store-MSIX-Package-to-GitHub-Release@v1
        with:
          store-id: ${{ env.MICROSOFT_STORE_ID }}
          token: ${{ github.token }}
          asset-name-pattern: BlockInsight_{version}_{arch}

      - name: Finalize release if Store MSIX is available (3h)
        if: steps.check-3h.outputs.should_sync == 'true'
        id: finalize-3h
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_ATTEMPT: 'false'
          IDENTITY_NAME: ${{ env.WINDOWS_PACKAGE_IDENTITY_NAME }}
          PUBLISHER: ${{ env.WINDOWS_PACKAGE_PUBLISHER }}
        run: node .github/scripts/sync-store-msix.cjs finalize

      - name: Wait before retry (4h)
        if: steps.check-3h.outputs.synced == 'false' && steps.finalize-3h.outputs.synced != 'true'
        run: sleep 3600

      - name: Check whether sync is still needed (4h)
        id: check-4h
        if: steps.check-3h.outputs.synced == 'false' && steps.finalize-3h.outputs.synced != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/sync-store-msix.cjs check

      - name: Upload Store MSIX to release (4h)
        if: steps.check-4h.outputs.should_sync == 'true'
        continue-on-error: true
        uses: JasonWei512/Upload-Microsoft-Store-MSIX-Package-to-GitHub-Release@v1
        with:
          store-id: ${{ env.MICROSOFT_STORE_ID }}
          token: ${{ github.token }}
          asset-name-pattern: BlockInsight_{version}_{arch}

      - name: Finalize release if Store MSIX is available (4h)
        if: steps.check-4h.outputs.should_sync == 'true'
        id: finalize-4h
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_ATTEMPT: 'false'
          IDENTITY_NAME: ${{ env.WINDOWS_PACKAGE_IDENTITY_NAME }}
          PUBLISHER: ${{ env.WINDOWS_PACKAGE_PUBLISHER }}
        run: node .github/scripts/sync-store-msix.cjs finalize

      - name: Wait before retry (6h)
        if: steps.check-4h.outputs.synced == 'false' && steps.finalize-4h.outputs.synced != 'true'
        run: sleep 7200

      - name: Check whether sync is still needed (6h)
        id: check-6h
        if: steps.check-4h.outputs.synced == 'false' && steps.finalize-4h.outputs.synced != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/sync-store-msix.cjs check

      - name: Upload Store MSIX to release (6h)
        if: steps.check-6h.outputs.should_sync == 'true'
        continue-on-error: true
        uses: JasonWei512/Upload-Microsoft-Store-MSIX-Package-to-GitHub-Release@v1
        with:
          store-id: ${{ env.MICROSOFT_STORE_ID }}
          token: ${{ github.token }}
          asset-name-pattern: BlockInsight_{version}_{arch}

      - name: Finalize release if Store MSIX is available (6h)
        if: steps.check-6h.outputs.should_sync == 'true'
        id: finalize-6h
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_ATTEMPT: 'true'
          IDENTITY_NAME: ${{ env.WINDOWS_PACKAGE_IDENTITY_NAME }}
          PUBLISHER: ${{ env.WINDOWS_PACKAGE_PUBLISHER }}
        run: node .github/scripts/sync-store-msix.cjs finalize
