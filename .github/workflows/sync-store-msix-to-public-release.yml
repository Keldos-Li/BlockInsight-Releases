name: Sync Store MSIX to public release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Draft release tag to finalize, for example v1.1.5.'
        required: true
        type: string

concurrency:
  group: sync-store-msix-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag }}
  MICROSOFT_STORE_ID: 9P467L4RBQXH
  WINDOWS_PACKAGE_IDENTITY_NAME: Keldos.BlockInsight
  WINDOWS_PACKAGE_PUBLISHER: CN=F3CEF3DF-A14E-4DDD-875E-DE0378559A97

jobs:
  attempt-now:
    name: Sync Store-signed MSIX (now)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: store-msix-sync-now
    outputs:
      synced: ${{ steps.finalize.outputs.synced || steps.check.outputs.synced }}
    steps:
      - name: Checkout release automation
        uses: actions/checkout@v4

      - name: Check whether sync is still needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/sync-store-msix.cjs check

      - name: Upload Store MSIX to release
        if: steps.check.outputs.should_sync == 'true'
        continue-on-error: true
        uses: JasonWei512/Upload-Microsoft-Store-MSIX-Package-to-GitHub-Release@v1
        with:
          store-id: ${{ env.MICROSOFT_STORE_ID }}
          token: ${{ github.token }}
          asset-name-pattern: BlockInsight_{version}_{arch}

      - name: Finalize release if Store MSIX is available
        if: steps.check.outputs.should_sync == 'true'
        id: finalize
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_ATTEMPT: 'false'
          IDENTITY_NAME: ${{ env.WINDOWS_PACKAGE_IDENTITY_NAME }}
          PUBLISHER: ${{ env.WINDOWS_PACKAGE_PUBLISHER }}
        run: node .github/scripts/sync-store-msix.cjs finalize

  attempt-30m:
    name: Sync Store-signed MSIX (30m)
    needs: attempt-now
    if: always() && needs.attempt-now.outputs.synced != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: store-msix-sync-30m
    outputs:
      synced: ${{ steps.finalize.outputs.synced || steps.check.outputs.synced }}
    steps:
      - name: Checkout release automation
        uses: actions/checkout@v4

      - name: Check whether sync is still needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/sync-store-msix.cjs check

      - name: Upload Store MSIX to release
        if: steps.check.outputs.should_sync == 'true'
        continue-on-error: true
        uses: JasonWei512/Upload-Microsoft-Store-MSIX-Package-to-GitHub-Release@v1
        with:
          store-id: ${{ env.MICROSOFT_STORE_ID }}
          token: ${{ github.token }}
          asset-name-pattern: BlockInsight_{version}_{arch}

      - name: Finalize release if Store MSIX is available
        if: steps.check.outputs.should_sync == 'true'
        id: finalize
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_ATTEMPT: 'false'
          IDENTITY_NAME: ${{ env.WINDOWS_PACKAGE_IDENTITY_NAME }}
          PUBLISHER: ${{ env.WINDOWS_PACKAGE_PUBLISHER }}
        run: node .github/scripts/sync-store-msix.cjs finalize

  attempt-1h:
    name: Sync Store-signed MSIX (1h)
    needs:
      - attempt-now
      - attempt-30m
    if: always() && needs.attempt-now.outputs.synced != 'true' && needs.attempt-30m.outputs.synced != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: store-msix-sync-1h
    outputs:
      synced: ${{ steps.finalize.outputs.synced || steps.check.outputs.synced }}
    steps:
      - name: Checkout release automation
        uses: actions/checkout@v4

      - name: Check whether sync is still needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/sync-store-msix.cjs check

      - name: Upload Store MSIX to release
        if: steps.check.outputs.should_sync == 'true'
        continue-on-error: true
        uses: JasonWei512/Upload-Microsoft-Store-MSIX-Package-to-GitHub-Release@v1
        with:
          store-id: ${{ env.MICROSOFT_STORE_ID }}
          token: ${{ github.token }}
          asset-name-pattern: BlockInsight_{version}_{arch}

      - name: Finalize release if Store MSIX is available
        if: steps.check.outputs.should_sync == 'true'
        id: finalize
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_ATTEMPT: 'false'
          IDENTITY_NAME: ${{ env.WINDOWS_PACKAGE_IDENTITY_NAME }}
          PUBLISHER: ${{ env.WINDOWS_PACKAGE_PUBLISHER }}
        run: node .github/scripts/sync-store-msix.cjs finalize

  attempt-3h:
    name: Sync Store-signed MSIX (3h)
    needs:
      - attempt-now
      - attempt-30m
      - attempt-1h
    if: always() && needs.attempt-now.outputs.synced != 'true' && needs.attempt-30m.outputs.synced != 'true' && needs.attempt-1h.outputs.synced != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: store-msix-sync-3h
    outputs:
      synced: ${{ steps.finalize.outputs.synced || steps.check.outputs.synced }}
    steps:
      - name: Checkout release automation
        uses: actions/checkout@v4

      - name: Check whether sync is still needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/sync-store-msix.cjs check

      - name: Upload Store MSIX to release
        if: steps.check.outputs.should_sync == 'true'
        continue-on-error: true
        uses: JasonWei512/Upload-Microsoft-Store-MSIX-Package-to-GitHub-Release@v1
        with:
          store-id: ${{ env.MICROSOFT_STORE_ID }}
          token: ${{ github.token }}
          asset-name-pattern: BlockInsight_{version}_{arch}

      - name: Finalize release if Store MSIX is available
        if: steps.check.outputs.should_sync == 'true'
        id: finalize
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_ATTEMPT: 'false'
          IDENTITY_NAME: ${{ env.WINDOWS_PACKAGE_IDENTITY_NAME }}
          PUBLISHER: ${{ env.WINDOWS_PACKAGE_PUBLISHER }}
        run: node .github/scripts/sync-store-msix.cjs finalize

  attempt-6h:
    name: Sync Store-signed MSIX (6h)
    needs:
      - attempt-now
      - attempt-30m
      - attempt-1h
      - attempt-3h
    if: always() && needs.attempt-now.outputs.synced != 'true' && needs.attempt-30m.outputs.synced != 'true' && needs.attempt-1h.outputs.synced != 'true' && needs.attempt-3h.outputs.synced != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: store-msix-sync-6h
    outputs:
      synced: ${{ steps.finalize.outputs.synced || steps.check.outputs.synced }}
    steps:
      - name: Checkout release automation
        uses: actions/checkout@v4

      - name: Check whether sync is still needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/sync-store-msix.cjs check

      - name: Upload Store MSIX to release
        if: steps.check.outputs.should_sync == 'true'
        continue-on-error: true
        uses: JasonWei512/Upload-Microsoft-Store-MSIX-Package-to-GitHub-Release@v1
        with:
          store-id: ${{ env.MICROSOFT_STORE_ID }}
          token: ${{ github.token }}
          asset-name-pattern: BlockInsight_{version}_{arch}

      - name: Finalize release if Store MSIX is available
        if: steps.check.outputs.should_sync == 'true'
        id: finalize
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_ATTEMPT: 'true'
          IDENTITY_NAME: ${{ env.WINDOWS_PACKAGE_IDENTITY_NAME }}
          PUBLISHER: ${{ env.WINDOWS_PACKAGE_PUBLISHER }}
        run: node .github/scripts/sync-store-msix.cjs finalize
