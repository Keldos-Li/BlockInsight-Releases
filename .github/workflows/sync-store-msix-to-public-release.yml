name: Sync Store MSIX to public release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Draft release tag to finalize, for example v1.1.5.'
        required: true
        type: string
      sync_now:
        description: 'Skip the initial 2h environment wait and try immediately.'
        required: false
        default: false
        type: boolean

concurrency:
  group: sync-store-msix-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag }}
  MICROSOFT_STORE_ID: 9P467L4RBQXH
  WINDOWS_PACKAGE_IDENTITY_NAME: Keldos.BlockInsight
  WINDOWS_PACKAGE_PUBLISHER: CN=F3CEF3DF-A14E-4DDD-875E-DE0378559A97

jobs:
  wait-first-attempt:
    name: Wait before first sync attempt
    if: ${{ !inputs.sync_now }}
    runs-on: ubuntu-latest
    timeout-minutes: 130
    environment: store-msix-sync-wait-2h
    steps:
      - run: echo "Initial Store MSIX sync wait finished."

  sync-first-attempt:
    name: Sync Store-signed MSIX first attempt
    needs: wait-first-attempt
    if: ${{ always() && (inputs.sync_now || needs.wait-first-attempt.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      synced: ${{ steps.result.outputs.synced }}
    steps:
      - name: Checkout release automation
        uses: actions/checkout@v4

      - name: Check whether sync is still needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/sync-store-msix.cjs check

      - name: Upload Store MSIX to release
        if: steps.check.outputs.should_sync == 'true'
        continue-on-error: true
        uses: JasonWei512/Upload-Microsoft-Store-MSIX-Package-to-GitHub-Release@v1
        with:
          store-id: ${{ env.MICROSOFT_STORE_ID }}
          token: ${{ github.token }}
          asset-name-pattern: BlockInsight_{version}_{arch}

      - name: Finalize release if Store MSIX is available
        if: steps.check.outputs.should_sync == 'true'
        id: finalize
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_ATTEMPT: 'false'
          IDENTITY_NAME: ${{ env.WINDOWS_PACKAGE_IDENTITY_NAME }}
          PUBLISHER: ${{ env.WINDOWS_PACKAGE_PUBLISHER }}
        run: node .github/scripts/sync-store-msix.cjs finalize

      - name: Record sync result
        id: result
        if: always()
        run: |
          synced="${{ steps.check.outputs.synced }}"
          if [ "${{ steps.finalize.outputs.synced }}" = "true" ]; then
            synced="true"
          fi
          echo "synced=${synced:-false}" >> "$GITHUB_OUTPUT"

  wait-retry-3h:
    name: Wait before retry at 3h
    needs: sync-first-attempt
    if: ${{ needs.sync-first-attempt.outputs.synced != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment: store-msix-sync-wait-1h
    steps:
      - run: echo "Store MSIX retry wait finished."

  sync-retry-3h:
    name: Sync Store-signed MSIX retry at 3h
    needs: wait-retry-3h
    if: ${{ needs.wait-retry-3h.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      synced: ${{ steps.result.outputs.synced }}
    steps:
      - name: Checkout release automation
        uses: actions/checkout@v4

      - name: Check whether sync is still needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/sync-store-msix.cjs check

      - name: Upload Store MSIX to release
        if: steps.check.outputs.should_sync == 'true'
        continue-on-error: true
        uses: JasonWei512/Upload-Microsoft-Store-MSIX-Package-to-GitHub-Release@v1
        with:
          store-id: ${{ env.MICROSOFT_STORE_ID }}
          token: ${{ github.token }}
          asset-name-pattern: BlockInsight_{version}_{arch}

      - name: Finalize release if Store MSIX is available
        if: steps.check.outputs.should_sync == 'true'
        id: finalize
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_ATTEMPT: 'false'
          IDENTITY_NAME: ${{ env.WINDOWS_PACKAGE_IDENTITY_NAME }}
          PUBLISHER: ${{ env.WINDOWS_PACKAGE_PUBLISHER }}
        run: node .github/scripts/sync-store-msix.cjs finalize

      - name: Record sync result
        id: result
        if: always()
        run: |
          synced="${{ steps.check.outputs.synced }}"
          if [ "${{ steps.finalize.outputs.synced }}" = "true" ]; then
            synced="true"
          fi
          echo "synced=${synced:-false}" >> "$GITHUB_OUTPUT"

  wait-retry-4h:
    name: Wait before retry at 4h
    needs: sync-retry-3h
    if: ${{ needs.sync-retry-3h.outputs.synced != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment: store-msix-sync-wait-1h
    steps:
      - run: echo "Store MSIX retry wait finished."

  sync-retry-4h:
    name: Sync Store-signed MSIX retry at 4h
    needs: wait-retry-4h
    if: ${{ needs.wait-retry-4h.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      synced: ${{ steps.result.outputs.synced }}
    steps:
      - name: Checkout release automation
        uses: actions/checkout@v4

      - name: Check whether sync is still needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/sync-store-msix.cjs check

      - name: Upload Store MSIX to release
        if: steps.check.outputs.should_sync == 'true'
        continue-on-error: true
        uses: JasonWei512/Upload-Microsoft-Store-MSIX-Package-to-GitHub-Release@v1
        with:
          store-id: ${{ env.MICROSOFT_STORE_ID }}
          token: ${{ github.token }}
          asset-name-pattern: BlockInsight_{version}_{arch}

      - name: Finalize release if Store MSIX is available
        if: steps.check.outputs.should_sync == 'true'
        id: finalize
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_ATTEMPT: 'false'
          IDENTITY_NAME: ${{ env.WINDOWS_PACKAGE_IDENTITY_NAME }}
          PUBLISHER: ${{ env.WINDOWS_PACKAGE_PUBLISHER }}
        run: node .github/scripts/sync-store-msix.cjs finalize

      - name: Record sync result
        id: result
        if: always()
        run: |
          synced="${{ steps.check.outputs.synced }}"
          if [ "${{ steps.finalize.outputs.synced }}" = "true" ]; then
            synced="true"
          fi
          echo "synced=${synced:-false}" >> "$GITHUB_OUTPUT"

  wait-retry-6h:
    name: Wait before retry at 6h
    needs: sync-retry-4h
    if: ${{ needs.sync-retry-4h.outputs.synced != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 130
    environment: store-msix-sync-wait-2h
    steps:
      - run: echo "Store MSIX retry wait finished."

  sync-retry-6h:
    name: Sync Store-signed MSIX final retry at 6h
    needs: wait-retry-6h
    if: ${{ needs.wait-retry-6h.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release automation
        uses: actions/checkout@v4

      - name: Check whether sync is still needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/sync-store-msix.cjs check

      - name: Upload Store MSIX to release
        if: steps.check.outputs.should_sync == 'true'
        continue-on-error: true
        uses: JasonWei512/Upload-Microsoft-Store-MSIX-Package-to-GitHub-Release@v1
        with:
          store-id: ${{ env.MICROSOFT_STORE_ID }}
          token: ${{ github.token }}
          asset-name-pattern: BlockInsight_{version}_{arch}

      - name: Finalize release if Store MSIX is available
        if: steps.check.outputs.should_sync == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_ATTEMPT: 'true'
          IDENTITY_NAME: ${{ env.WINDOWS_PACKAGE_IDENTITY_NAME }}
          PUBLISHER: ${{ env.WINDOWS_PACKAGE_PUBLISHER }}
        run: node .github/scripts/sync-store-msix.cjs finalize
